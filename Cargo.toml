[package]
name = "livy-tee"
version = "0.1.1"
edition = "2021"
description = "Intel TDX and Google Confidential Space attestation for the Livy provenance system."
license = "MIT"
keywords     = ["tdx", "attestation", "tee", "intel", "provenance"]
categories   = ["cryptography", "hardware-support", "api-bindings", "authentication"]
repository   = "https://github.com/livylabs/livy-tee"
homepage     = "https://livylabs.xyz"
rust-version = "1.75"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = "1"
sha2      = "0.10"
hex       = "0.4"
base64    = "0.22"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
uuid      = { version = "1", features = ["v4", "serde"] }

reqwest      = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
jsonwebtoken = { version = "9", optional = true }
zeroize      = { version = "1", optional = true }

[dev-dependencies]
base64     = "0.22"
serde_json = "1"
tokio      = { version = "1.48", features = ["full"] }

[features]
# Default: TSM configfs generation — requires TDX hardware (kernel ≥ 6.7).
# For development without hardware: cargo build --features mock-tee
default    = []
mock-tee   = []
# Shared HTTP/JWT plumbing for remote attestation providers.
attestation = ["dep:reqwest", "dep:jsonwebtoken"]
# ita-verify: Intel Trust Authority REST API verification
ita-verify = ["attestation"]
# confidential-space: Google Confidential Space launcher and token verification
confidential-space = ["attestation", "dep:zeroize"]

[[example]]
name = "ita_cli_cross_verify"
required-features = ["ita-verify"]

[[example]]
name = "getting_started"
required-features = ["ita-verify"]

[[example]]
name = "confidential_space_attest"
required-features = ["confidential-space"]

[[example]]
name = "confidential_space_verify"
required-features = ["confidential-space"]
